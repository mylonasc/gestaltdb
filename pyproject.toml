[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gestaltdb"
version = "0.10.1"
description = "A pure Python GraphDB for attributed graphs."
authors = [
    { name = "Mylonas Charilaos", email = "mylonas.charilaos@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "lark>=1.2",
    "numpy>=1.23",
]

[project.optional-dependencies]
lmdb = ["lmdb"]
leveldb = ["plyvel>=1.5.1"]
msgpack = ["msgpack>=1.2.1"]
protobuf = ["protobuf>=6.33.6"]
backends = ["lmdb", "plyvel>=1.5.1", "pyrex-rocksdb>=0.4.1"]
serializers = ["msgpack>=1.2.1", "protobuf>=6.33.6"]
bloom = ["pybloom-live"]
coverage = ["coverage", "pytest"]
docs = ["myst-parser", "sphinx", "sphinx-rtd-theme"]
rocksdb = ["pyrex-rocksdb>=0.4.1"]
arrow = ["pyarrow"]
polars = ["polars", "pyarrow"]
fast-ingest = ["pyarrow", "polars", "pyrex-rocksdb>=0.4.1"]
external-bench = ["arcadedb-embedded; python_version >= '3.10'", "gqlalchemy", "ladybug", "latticedb", "neo4j", "psycopg[binary]"]
all = ["lmdb", "msgpack>=1.2.1", "plyvel>=1.5.1", "protobuf>=6.33.6", "pybloom-live", "pyrex-rocksdb>=0.4.1", "pyarrow", "polars", "arcadedb-embedded; python_version >= '3.10'", "gqlalchemy", "ladybug", "latticedb", "neo4j", "psycopg[binary]"]
dev = ["coverage", "lmdb", "msgpack>=1.2.1", "myst-parser", "plyvel>=1.5.1", "protobuf>=6.33.6", "pybloom-live", "pyrex-rocksdb>=0.4.1", "pyarrow", "polars", "pytest", "sphinx", "sphinx-rtd-theme", "arcadedb-embedded; python_version >= '3.10'", "gqlalchemy", "ladybug", "latticedb", "neo4j", "psycopg[binary]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gestaltdb = ["agent_skill/**/*.md", "viz/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "coverage>=7.10.7",
    "jinja2>=3.1",
    "pytest>=8.0",
]
