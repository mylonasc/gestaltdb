[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gestaltdb"
version = "0.14.0rc2"
description = "A pure Python GraphDB for attributed graphs."
authors = [
    { name = "Mylonas Charilaos", email = "mylonas.charilaos@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "lark>=1.2",
    "numpy>=1.23",
]

[project.optional-dependencies]
rdf = ["rdflib>=7.6.0,<8"]
lmdb = ["lmdb"]
leveldb = ["plyvel>=1.5.1"]
msgpack = ["msgpack>=1.2.1"]
protobuf = ["protobuf>=6.33.6"]
backends = ["lmdb", "plyvel>=1.5.1", "pyrex-rocksdb>=0.4.1"]
serializers = ["msgpack>=1.2.1", "protobuf>=6.33.6"]
bloom = ["pybloom-live"]
coverage = ["coverage", "pytest"]
docs = ["myst-parser", "sphinx", "sphinx-rtd-theme"]
lint = ["ruff==0.17.2", "mypy==2.4.0"]
rocksdb = ["pyrex-rocksdb>=0.4.1"]
arrow = ["pyarrow"]
polars = ["polars", "pyarrow"]
fast-ingest = ["pyarrow", "polars", "pyrex-rocksdb>=0.4.1"]
external-bench = ["arcadedb-embedded; python_version >= '3.10'", "gqlalchemy", "ladybug", "latticedb", "neo4j", "psycopg[binary]"]
all = ["lmdb", "msgpack>=1.2.1", "plyvel>=1.5.1", "protobuf>=6.33.6", "pybloom-live", "pyrex-rocksdb>=0.4.1", "pyarrow", "polars", "arcadedb-embedded; python_version >= '3.10'", "gqlalchemy", "ladybug", "latticedb", "neo4j", "psycopg[binary]"]
dev = ["coverage", "lmdb", "msgpack>=1.2.1", "myst-parser", "plyvel>=1.5.1", "protobuf>=6.33.6", "pybloom-live", "pyrex-rocksdb>=0.4.1", "pyarrow", "polars", "pytest", "sphinx", "sphinx-rtd-theme", "arcadedb-embedded; python_version >= '3.10'", "gqlalchemy", "ladybug", "latticedb", "neo4j", "psycopg[binary]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gestaltdb = ["agent_skill/**/*.md", "agent_skill/api_index.json", "py.typed", "viz/static/*"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gestaltdb.sampling._arrays", "gestaltdb.sampling.adjacency", "gestaltdb.sampling.feeder"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "gestaltdb._graph.temporal_types",
    "gestaltdb._graph.stored_rule_types",
    "gestaltdb._graph.temporal_reads",
    "gestaltdb._graph.temporal_selection",
    "gestaltdb._graph.temporal_writes",
    "gestaltdb._graph.temporal_indexes",
    "gestaltdb._graph.temporal_orphans",
    "gestaltdb._graph.temporal_entity_writes",
    "gestaltdb._graph.temporal_sequence",
    "gestaltdb._graph.stored_rules",
    "gestaltdb._graph.truth_maintenance",
    "gestaltdb.temporal_engine",
    "gestaltdb.history",
    "gestaltdb.epistemic_engine",
    "gestaltdb.rules_engine",
]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "gestaltdb.query_engine.cypher._runtime_types",
    "gestaltdb.query_engine.cypher._parser_types",
    "gestaltdb.query_engine.cypher.parser",
    "gestaltdb.query_engine.cypher.runtime",
    "gestaltdb.query_engine.cypher.write",
]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
include = ["src/**/*.py", "scripts/check_code_quality.py", "tests/test_code_quality.py"]

[tool.ruff.lint]
# Start with correctness, not a repository-wide formatting/API rewrite.
# In particular F401 cleanup needs care around compatibility re-exports.
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "coverage>=7.10.7",
    "jinja2>=3.1",
    "pytest>=8.0",
]
