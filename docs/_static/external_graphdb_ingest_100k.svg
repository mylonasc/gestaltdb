<svg xmlns="http://www.w3.org/2000/svg" width="940" height="404" viewBox="0 0 940 404" role="img" aria-labelledby="title desc">
<title id="title">External graph database ingestion time</title>
<desc id="desc">Mean ingestion time for a 100000 node and 500000 edge benchmark, lower is better.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="34" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Ingestion time: 100k nodes / 500k edges</text>
<text x="24" y="56" font-family="Inter, Arial, sans-serif" font-size="13" fill="#4b5563">Mean seconds over 3 repetitions. AGE includes CSV bulk load plus GIN index build.</text>
<text x="24" y="99" font-family="Inter, Arial, sans-serif" font-size="14" fill="#111827">GestaltDB</text>
<rect x="220" y="80" width="79.7" height="24" rx="4" fill="#2563eb"/>
<text x="309.7" y="98" font-family="Inter, Arial, sans-serif" font-size="13" fill="#111827">1.854s +/- 0.167s</text>
<text x="795" y="98" font-family="Inter, Arial, sans-serif" font-size="12" fill="#4b5563">271,137 edges/s</text>
<text x="24" y="145" font-family="Inter, Arial, sans-serif" font-size="14" fill="#111827">Apache AGE</text>
<rect x="220" y="126" width="120.1" height="24" rx="4" fill="#7c3aed"/>
<text x="350.1" y="144" font-family="Inter, Arial, sans-serif" font-size="13" fill="#111827">2.794s +/- 0.040s</text>
<text x="795" y="144" font-family="Inter, Arial, sans-serif" font-size="12" fill="#4b5563">179,005 edges/s</text>
<text x="24" y="191" font-family="Inter, Arial, sans-serif" font-size="14" fill="#111827">GestaltDB tx</text>
<rect x="220" y="172" width="134.6" height="24" rx="4" fill="#94a3b8"/>
<text x="364.6" y="190" font-family="Inter, Arial, sans-serif" font-size="13" fill="#111827">3.131s +/- 0.264s</text>
<text x="795" y="190" font-family="Inter, Arial, sans-serif" font-size="12" fill="#4b5563">160,494 edges/s</text>
<text x="24" y="237" font-family="Inter, Arial, sans-serif" font-size="14" fill="#111827">ArcadeDB</text>
<rect x="220" y="218" width="260.6" height="24" rx="4" fill="#94a3b8"/>
<text x="490.6" y="236" font-family="Inter, Arial, sans-serif" font-size="13" fill="#111827">6.060s +/- 0.403s</text>
<text x="795" y="236" font-family="Inter, Arial, sans-serif" font-size="12" fill="#4b5563">82,745 edges/s</text>
<text x="24" y="283" font-family="Inter, Arial, sans-serif" font-size="14" fill="#111827">Memgraph</text>
<rect x="220" y="264" width="370.9" height="24" rx="4" fill="#94a3b8"/>
<text x="600.9" y="282" font-family="Inter, Arial, sans-serif" font-size="13" fill="#111827">8.625s +/- 0.069s</text>
<text x="795" y="282" font-family="Inter, Arial, sans-serif" font-size="12" fill="#4b5563">57,970 edges/s</text>
<text x="24" y="329" font-family="Inter, Arial, sans-serif" font-size="14" fill="#111827">Neo4j</text>
<rect x="220" y="310" width="560.0" height="24" rx="4" fill="#94a3b8"/>
<text x="790.0" y="328" font-family="Inter, Arial, sans-serif" font-size="13" fill="#111827">13.024s +/- 0.197s</text>
<text x="795" y="328" font-family="Inter, Arial, sans-serif" font-size="12" fill="#4b5563">38,396 edges/s</text>
</svg>
