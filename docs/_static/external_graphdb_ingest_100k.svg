<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .title { font-size: 16px; font-weight: 600; fill: #1f2328; }
  .subtitle { font-size: 12px; fill: #656d76; }
  .label { font-size: 13px; fill: #1f2328; text-anchor: end; }
  .bar { fill: #0969da; rx: 4px; }
  .bar-baseline { fill: #1a7f37; rx: 4px; }
  .value { font-size: 12px; fill: #1f2328; font-variant-numeric: tabular-nums; }
  .relative { font-size: 11px; fill: #656d76; }
</style>
<rect width="680" height="300" fill="#ffffff" />
<text x="24" y="28" class="title">100k Node / 500k Edge Ingestion Time</text>
<text x="24" y="46" class="subtitle">Lower is faster · Mean wall-clock seconds across 3 runs</text>
<text x="170" y="80" class="label">GestaltDB</text>
<rect x="180" y="66" width="58.7" height="22" class="bar-baseline" />
<text x="248.7" y="81" class="value">2.32s ±0.13s</text>
<text x="388.7" y="81" class="relative">(1.0x)</text>
<text x="170" y="122" class="label">GestaltDB tx</text>
<rect x="180" y="108" width="93.7" height="22" class="bar" />
<text x="283.7" y="123" class="value">3.70s ±0.38s</text>
<text x="423.7" y="123" class="relative">(1.6x)</text>
<text x="170" y="164" class="label">ArcadeDB</text>
<rect x="180" y="150" width="144.4" height="22" class="bar" />
<text x="334.4" y="165" class="value">5.71s ±0.16s</text>
<text x="474.4" y="165" class="relative">(2.5x)</text>
<text x="170" y="206" class="label">Memgraph</text>
<rect x="180" y="192" width="276.9" height="22" class="bar" />
<text x="466.9" y="207" class="value">10.95s ±0.22s</text>
<text x="606.9" y="207" class="relative">(4.7x)</text>
<text x="170" y="248" class="label">Neo4j</text>
<rect x="180" y="234" width="380.0" height="22" class="bar" />
<text x="570.0" y="249" class="value">15.02s ±0.03s</text>
<text x="710.0" y="249" class="relative">(6.5x)</text>
</svg>
