name: Visualization

on:
  pull_request:
    paths:
      - 'web/**'
      - 'src/gestaltdb/viz/**'
      - 'tests/test_viz*'
      - '.github/workflows/visualization.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/gestaltdb/viz/**'
      - 'tests/test_viz*'
      - '.github/workflows/visualization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-viz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e . pytest
      - run: npm ci
        working-directory: web
      - run: npm run check:bundle
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test
        working-directory: web
      - run: python -m pytest tests/test_viz*.py -q
