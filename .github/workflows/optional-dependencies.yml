name: Optional dependency combinations

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - src/gestaltdb/graphdb.py
      - src/gestaltdb/kvstores.py
      - src/gestaltdb/serializers.py
      - tests/optional_install_smoke.py
      - .github/workflows/optional-dependencies.yml
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - src/gestaltdb/graphdb.py
      - src/gestaltdb/kvstores.py
      - src/gestaltdb/serializers.py
      - tests/optional_install_smoke.py
      - .github/workflows/optional-dependencies.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-smoke:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: core
            install: "."
          - mode: leveldb+messagepack
            install: ".[leveldb,msgpack]"
          - mode: lmdb+protobuf
            install: ".[lmdb,protobuf]"
          - mode: pyrex+json
            install: ".[rocksdb]"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install selected components
        run: python -m pip install "${{ matrix.install }}"

      - name: Exercise selected components
        run: python tests/optional_install_smoke.py "${{ matrix.mode }}"
