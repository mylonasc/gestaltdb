name: Optional dependency combinations

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - src/gestaltdb/graphdb.py
      - src/gestaltdb/kvstores.py
      - src/gestaltdb/serializers.py
      - tests/optional_install_smoke.py
      - .github/workflows/optional-dependencies.yml
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - src/gestaltdb/graphdb.py
      - src/gestaltdb/kvstores.py
      - src/gestaltdb/serializers.py
      - tests/optional_install_smoke.py
      - .github/workflows/optional-dependencies.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-smoke:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: core
            install: "."
          - mode: leveldb+messagepack
            install: ".[leveldb,msgpack]"
          - mode: lmdb+protobuf
            install: ".[lmdb,protobuf]"
          - mode: pyrex+json
            install: ".[rocksdb]"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install selected components
        run: python -m pip install "${{ matrix.install }}"

      - name: Exercise selected components
        run: python tests/optional_install_smoke.py "${{ matrix.mode }}"
