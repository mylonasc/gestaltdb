name: Framework smokes

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/gestaltdb/sampling/**'
      - 'tests/test_sampling*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/framework.yml'
  push:
    branches: [main]
    paths:
      - 'src/gestaltdb/sampling/**'
      - 'tests/test_sampling*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/framework.yml'
  workflow_dispatch:

# Least-privilege default: this job only checks out code and runs tests.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpu-frameworks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package with test dependencies
        run: python -m pip install -e ".[coverage]"

      - name: Install real CPU framework dependencies
        # CPU-only Torch keeps install cost bounded. DGL/TensorFlow stay
        # importorskip-covered: their smokes run when available but are not
        # required here.
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          torch pyarrow

      - name: Run real framework conversion smokes
        run: python -m pytest tests/test_sampling_real_frameworks.py -q -ra

      - name: Run stub absence coverage alongside
        run: >-
          python -m pytest tests/test_sampling_pyg_blocks.py
          "tests/test_sampling.py::test_sampled_batch_optional_adapter_dependency_errors"
          -q -ra
