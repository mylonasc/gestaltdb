name: Ontology conformance

on:
  push:
    branches: [main, onto-dev]
    paths:
      - "src/gestaltdb/**/*.py"
      - "tests/**"
      - "benchmarks/ontology.py"
      - "benchmarks/cli.py"
      - "docs/ontology-contract.rst"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ontology.yml"
  pull_request:
    branches: [main, onto-dev]
    paths:
      - "src/gestaltdb/**/*.py"
      - "tests/**"
      - "benchmarks/ontology.py"
      - "benchmarks/cli.py"
      - "docs/ontology-contract.rst"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ontology.yml"

permissions:
  contents: read

jobs:
  ontology:
    name: Ontology (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install LevelDB build dependency
        run: sudo apt-get update && sudo apt-get install --yes libleveldb-dev
      - name: Install test backends and optional conformance oracle
        run: python -m pip install -e ".[coverage,lmdb,leveldb]" "owlrl==7.6.2" "rdflib==7.6.0" "clingo==5.8.2"
      - name: Require an importable oracle rather than silently skipping
        run: >-
          python -c "import owlrl, rdflib, clingo; from importlib.metadata import version; print({'owlrl': version('owlrl'), 'rdflib': version('rdflib'), 'clingo': version('clingo')})"
      - name: Run standalone, adapter and oracle gates
        run: >-
          python -m pytest -q
          tests/test_reasoning_contracts.py
          tests/test_reasoning_engine.py
          tests/test_reasoning_proofs.py
          tests/test_ontology_compiler.py
          tests/test_reasoning_claims.py
          tests/test_ontology_conformance.py
          tests/test_ontology_benchmarks.py
