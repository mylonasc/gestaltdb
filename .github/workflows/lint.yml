name: Lint

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.py'
      - 'scripts/check_code_quality.py'
      - 'tests/test_code_quality.py'
      - 'planning/code-quality/module-size-baseline.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/lint.yml'
  push:
    branches: [main]
    paths:
      - 'src/**/*.py'
      - 'scripts/check_code_quality.py'
      - 'tests/test_code_quality.py'
      - 'planning/code-quality/module-size-baseline.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'
      - name: Install lightweight lint and test dependencies
        run: python -m pip install -e '.[lint,coverage]'
      - name: Lint library and gate implementation
        run: python -m ruff check .
      - name: Reject oversized library modules and stale budgets
        run: python scripts/check_code_quality.py
      - name: Test quality gate
        run: python -m pytest tests/test_code_quality.py -q
