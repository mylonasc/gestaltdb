name: Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/**/*.py'
      - 'src/gestaltdb/viz/static/**'
      - 'tests/**'
      - 'benchmarks/**/*.py'
      - 'benchmarks/*requirements*.txt'
      - 'scripts/**/*.py'
      - 'scripts/**/*.sh'
      - 'planning/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**/*.py'
      - 'src/gestaltdb/viz/static/**'
      - 'tests/**'
      - 'benchmarks/**/*.py'
      - 'benchmarks/*requirements*.txt'
      - 'scripts/**/*.py'
      - 'scripts/**/*.sh'
      - 'planning/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tests.yml'

# Least-privilege default: jobs only check out code and run tests.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PRs exercise the supported edges; pushes retain every supported minor.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.10", "3.13"]' || '["3.10", "3.11", "3.12", "3.13"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install LevelDB build dependency
        run: sudo apt-get update && sudo apt-get install --yes libleveldb-dev

      - name: Install package with test dependencies
        run: python -m pip install -e ".[coverage]"

      - name: Run tests
        run: python -m pytest

  optional-integrations:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install LevelDB build dependency
        run: sudo apt-get update && sudo apt-get install --yes libleveldb-dev

      - name: Install package with all optional integrations
        # Python 3.13 may build Plyvel from source rather than use a wheel.
        run: python -m pip install -e ".[all,coverage]"

      - name: Run tests
        run: python -m pytest
