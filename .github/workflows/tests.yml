name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least-privilege default: jobs only check out code and run tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package with test extras
        run: python -m pip install -e ".[all,coverage]"

      - name: Run tests
        run: python -m pytest
