name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least-privilege default: jobs only check out code and run tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install LevelDB build dependency
        run: sudo apt-get update && sudo apt-get install --yes libleveldb-dev

      - name: Install package with test dependencies
        run: python -m pip install -e ".[coverage]"

      - name: Run tests
        run: python -m pytest

  optional-integrations:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package with all optional integrations
        run: python -m pip install -e ".[all,coverage]"

      - name: Run tests
        run: python -m pytest
