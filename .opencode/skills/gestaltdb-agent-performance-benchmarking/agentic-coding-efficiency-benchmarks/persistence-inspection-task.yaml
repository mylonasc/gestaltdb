id: persistence-inspection-usage-script
name: Persistence And Inspection Usage Script
description: Build a tiny standalone script that stores, reopens, and inspects a manifest-backed GestaltDB database.
timeout_seconds: 300
tags:
  - persistence
  - inspection
  - library-usage
  - deterministic-validation
allowed_paths:
  - agent_benchmark_solutions/persistence_inspection_usage.py
setup_commands: []
validation_commands:
  - uv run python agent_benchmark_solutions/persistence_inspection_usage.py
prompt: |
  You are working as a user of the GestaltDB library. First read `.opencode/skills/gestaltdb-user-guide/SKILL.md` if it exists. Also use `python -m gestaltdb.agent_docs search "GraphDB.open|index_statistics|manifest|properties" --limit 5` if you need targeted docs. Create a tiny standalone script at `agent_benchmark_solutions/persistence_inspection_usage.py`.

  The script must:
  - Use `TemporaryDirectory` for all database files.
  - Use `GraphDB.create(...)` to create a manifest-backed LevelDB database with serializer `json`.
  - Create indexed node property `kind` and indexed edge property `score` before writing data.
  - Add two nodes, `drug` and `protein`, with useful labels and properties, plus one typed `TARGETS` edge with a numeric `score`.
  - Close the first graph handle in a `finally` block.
  - Reopen the same database with `GraphDB.open(...)`.
  - Assert `reopened.manifest` reports backend `leveldb` and serializer `json`.
  - Assert `reopened.index_statistics()` reports node index `kind` and edge index `score`.
  - Inspect retrieved `Node.properties` and `Edge.properties` and assert the expected property names and values.
  - Assert index-backed lookups work with `nodes_by_property("kind", "drug")` and `edges_by_property("score", 0.92)`.
  - Close the reopened graph handle in a `finally` block.

  Do not modify files under `src/`, `tests/`, docs, or benchmark runner code. Validate with `uv run python agent_benchmark_solutions/persistence_inspection_usage.py`.
judge_rubric: |
  Score from 1 to 5. Award high scores for a concise, runnable public-API usage script that uses GraphDB.create/open correctly, persists and reopens the DB, inspects manifest and index_statistics, inspects Node.properties and Edge.properties, uses index-backed lookups, and closes both graph handles. Penalize source edits, manual backend reconstruction instead of GraphDB.open, missing assertions, undocumented internals, or leaked handles.
minimum_judge_score: 4
