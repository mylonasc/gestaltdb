id: index-maintenance-usage-script
name: Deferred Index Maintenance Usage Script
description: Build a tiny standalone script that uses one GestaltDB node property index correctly.
timeout_seconds: 300
tags:
  - ingestion
  - indexing
  - library-usage
  - deterministic-validation
allowed_paths:
  - agent_benchmark_solutions/index_maintenance_usage.py
setup_commands: []
validation_commands:
  - uv run python agent_benchmark_solutions/index_maintenance_usage.py
prompt: |
  You are working as a user of the GestaltDB library. First read `.opencode/skills/gestaltdb-user-guide/SKILL.md` if it exists. Create a tiny standalone script at `agent_benchmark_solutions/index_maintenance_usage.py`.

  The script must:
  - Use `TemporaryDirectory` for all database files.
  - Import `GraphDB`, `Node`, and `Edge` from `gestaltdb.graphdb`.
  - Use `LevelDBStore` and `PickleSerializer` directly.
  - Create a node property index for `age` before writing nodes.
  - Add two `Person` nodes with ages 30 and 41, plus one typed edge so the script also shows the relationship type property convention.
  - Assert that `nodes_by_property("age", 30)` returns Alice.
  - Assert that `nodes_by_property_range("age", 35, 50)` returns Bob.
  - Close the graph handle in a `finally` block.

  Do not modify files under `src/`, `tests/`, docs, or benchmark runner code. Validate with `uv run python agent_benchmark_solutions/index_maintenance_usage.py`.
judge_rubric: |
  Score from 1 to 5. Award high scores for a concise, runnable public-API usage script that creates an index explicitly, demonstrates exact/range node lookups, uses documented imports, and closes resources. Penalize library source edits, undocumented internal APIs, missing assertions, or leaked graph handles.
minimum_judge_score: 4
